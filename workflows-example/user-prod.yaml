name: Deploy User Service To Production

on:
  release:
    types:
      - published

jobs:
  dockerize_n_push:
    name: Dockerize & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@v3
      - name: Set outputs
        id: short_sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: lowercase repository
        id: repository
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ github.repository }}/user-production
      - name: Build container image
        uses: docker/build-push-action@v4
        with:
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true
          push: true
          context: .
          file: ./build/user/Dockerfile
          tags: |
            ghcr.io/${{ steps.repository.outputs.lowercase }}:${{ steps.short_sha.outputs.sha_short }}
      - name: Set output variables
        id: user_api
        run: echo "image_name=ghcr.io/${{ steps.repository.outputs.lowercase }}:${{ steps.short_sha.outputs.sha_short }}" >> $GITHUB_OUTPUT
    outputs:
      image_name: ${{ steps.user_api.outputs.image_name}}
  deploy:
    needs: dockerize_n_push
    runs-on: ubuntu-latest
    steps:
      - uses: Nortezh/nortezh-action@v1.0.5
        with:
          action: deployment.create-revision
          project: example-production
          location: olufy-0
          name: example-customer-service
          image: ${{ needs.dockerize_n_push.outputs.image_name }}
          type: WebService
        env:
          SA_AUTH_EMAIL: ${{ secrets.NTZ_SVA_EMAIL_PROD }}
          SA_AUTH_KEY: ${{ secrets.NTZ_SVA_KEY_PROD }}
